# Builds the Cod preview for x86_64 Linux and uploads it to a GitHub prerelease.
# A pushed tag v* makes a prerelease named for the tag; a manual run makes a prerelease preview-<run number>.
name: Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # No debug info: keeps the target folder and the link step small enough for a free runner.
      CARGO_PROFILE_RELEASE_FAST_DEBUG: "0"
      # RUSTFLAGS replaces the rustflags of .cargo/config.toml, so the first two pairs repeat them.
      # The last pair links with mold.
      RUSTFLAGS: "-C symbol-mangling-version=v0 --cfg tokio_unstable -C link-arg=-fuse-ld=mold"
      CEF_VERSION: 154.0.34
      CEF_PATH: /home/runner/cef
      CC: clang
      CXX: clang++
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runner has about 85 GB free before the build and the build adds about 14 GB, so nothing is deleted.
      - name: Show disk space
        run: df -h /

      - name: Install Linux dependencies
        run: |
          ./script/linux
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev mold

      - name: Install Rust toolchain
        run: |
          # Installs the toolchain named in rust-toolchain.toml (older rustup does it in `rustup show`).
          rustup toolchain install || rustup show
          rustc --version
          cargo --version

      # sccache keeps every compiled crate (third-party and workspace) in the GitHub Actions cache.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      # Only the cargo registry and git checkouts are kept here. The target folder is left to sccache,
      # so the compiled output is not stored twice against the 10 GB cache limit.
      # Only master writes caches, so tags and other branches cannot fill or poison them.
      - name: Restore the cargo registry cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          key: release-fast
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The cef crate downloads CEF from the Spotify CDN into CEF_PATH at build time.
      # The folder is cached by CEF version (keep CEF_VERSION in step with the cef crate in Cargo.toml).
      # Only master saves it, like the other caches.
      - name: Restore the CEF download
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ env.CEF_VERSION }}-linux-x86_64

      - name: Build (cargo release-fast, no LTO, mold, sccache)
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/master' && 'READ_WRITE' || 'READ_ONLY' }}
          RUSTC_WRAPPER: sccache
        run: |
          sccache --zero-stats
          cargo build --profile release-fast --timings -p zed -p cod_browser
          sccache --show-stats
          df -h /
          du -sh "$CEF_PATH"

      - name: Upload the cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timing
          path: target/cargo-timings/cargo-timing.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the CEF download
        if: github.ref == 'refs/heads/master' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ env.CEF_VERSION }}-linux-x86_64

      # The CEF runtime goes into cod/cef/, which cod-wayland.sh uses as COD_CEF_DIR.
      # Not shipped: headers, the wrapper library, chrome-sandbox (the helper runs with --no-sandbox), other locales.
      - name: Package (strip, tar)
        run: |
          mkdir -p cod/cef/locales
          cp target/release-fast/zed cod/cod
          cp target/release-fast/cod-browser cod/cod-browser
          strip cod/cod cod/cod-browser
          cef_dir="$CEF_PATH/$CEF_VERSION/cef_linux_x86_64"
          ls -l "$cef_dir"
          cp "$cef_dir"/*.so "$cef_dir"/*.so.* "$cef_dir"/*.pak "$cef_dir"/*.bin "$cef_dir"/*.dat "$cef_dir"/*.json cod/cef/ 2>/dev/null || true
          cp "$cef_dir"/locales/en-US.pak cod/cef/locales/
          rm -f cod/cef/archive.json
          strip --strip-unneeded cod/cef/*.so
          test -f cod/cef/libcef.so
          test -f cod/cef/icudtl.dat
          cp script/cod-xwayland.sh script/cod-wayland.sh cod/
          chmod +x cod/cod cod/cod-browser cod/cod-xwayland.sh cod/cod-wayland.sh
          cp LICENSE-GPL LICENSE-APACHE README.md cod/
          tar -czf cod-linux-x86_64.tar.gz cod
          ls -l cod cod/cef cod-linux-x86_64.tar.gz
          tar -tzf cod-linux-x86_64.tar.gz | head -50
          df -h /

      - name: Compression experiment (temporary)
        run: |
          mkdir exp
          cp target/release-fast/zed exp/cod
          strip exp/cod
          cef_dir="$CEF_PATH/$CEF_VERSION/cef_linux_x86_64"
          mkdir -p exp/cef/locales
          cp "$cef_dir"/*.so "$cef_dir"/*.so.* "$cef_dir"/*.pak "$cef_dir"/*.bin "$cef_dir"/*.dat "$cef_dir"/*.json exp/cef/ 2>/dev/null || true
          cp "$cef_dir"/locales/en-US.pak exp/cef/locales/
          strip --strip-unneeded exp/cef/*.so
          ls -l exp/cod exp/cef
          t() { local s=$(date +%s); "$@" > /dev/null; echo "  took $(( $(date +%s) - s )) s"; }
          for part in cod cef; do
            tar -cf exp/$part.tar -C exp $part
            ls -l exp/$part.tar
            echo "== $part gzip -6"; t sh -c "gzip -6 -c exp/$part.tar > exp/$part.tar.gz"; ls -l exp/$part.tar.gz
            echo "== $part zstd -3 -T0"; t sh -c "zstd -3 -T0 -c exp/$part.tar > exp/$part.3.zst"; ls -l exp/$part.3.zst
            echo "== $part zstd -10 -T0"; t sh -c "zstd -10 -T0 -c exp/$part.tar > exp/$part.10.zst"; ls -l exp/$part.10.zst
            echo "== $part zstd -19 --long=27 -T0"; t sh -c "zstd -19 --long=27 -T0 -c exp/$part.tar > exp/$part.19.zst"; ls -l exp/$part.19.zst
            echo "== $part xz -6 -T0"; t sh -c "xz -6 -T0 -c exp/$part.tar > exp/$part.6.xz"; ls -l exp/$part.6.xz
            echo "== $part xz -9e -T0"; t sh -c "xz -9e -T0 -c exp/$part.tar > exp/$part.9.xz"; ls -l exp/$part.9.xz
          done
          echo "== decompress times"
          t sh -c "zstd -d -c exp/cef.19.zst > /dev/null"
          t sh -c "xz -d -c exp/cef.9.xz > /dev/null"
          t sh -c "gzip -d -c exp/cef.tar.gz > /dev/null"
          t sh -c "xz -d -c exp/cod.9.xz > /dev/null"
          t sh -c "zstd -d -c exp/cod.19.zst > /dev/null"
          for f in exp/cef/*.so exp/cef/*.pak exp/cef/*.bin exp/cef/*.dat; do echo "$f $(stat -c %s $f) $(xz -6 -c $f | wc -c)"; done

      - name: Upload to a prerelease
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="preview-$RUN_NUMBER"
          fi
          gh release create "$tag" cod-linux-x86_64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Cod preview for x86_64 Linux, built from $GITHUB_SHA. See the README for how to try it."
