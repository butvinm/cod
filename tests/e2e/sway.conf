# Headless sway for the end-to-end tests (started by script/e2e): one fixed output, no borders, nothing else.
output HEADLESS-1 resolution 1440x900 scale 1
default_border none
hide_edge_borders both
# Cod is a native Wayland client; without this sway tries to start Xwayland and logs an error when it is not installed.
xwayland disable
