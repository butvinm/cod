<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cod off-screen test page</title>
<style>
  body { font: 16px sans-serif; margin: 0; padding: 12px; background: #f4f8ff; }
  #banner { height: 60px; background: #2b6cb0; color: white; padding: 8px; }
  #filler { height: 2400px; background: linear-gradient(#f4f8ff, #fbd38d); }
  input, textarea { font-size: 18px; width: 70%; margin: 6px 0; }
  a { font-size: 20px; }
</style>
</head>
<body>
  <div id="banner">Cod off-screen test page</div>
  <p><a id="next" href="offscreen_next.html">Go to the second page</a></p>
  <p><input id="field" type="text" placeholder="type here"></p>
  <p><textarea id="notes" rows="3"></textarea></p>
  <div id="filler">scroll me</div>
  <script>
    window.codState = function () {
      var field = document.getElementById('field');
      var rect = function (id) {
        var box = document.getElementById(id).getBoundingClientRect();
        return { x: Math.round(box.x + box.width / 2), y: Math.round(box.y + box.height / 2) };
      };
      return JSON.stringify({
        scrollY: Math.round(window.scrollY),
        innerWidth: window.innerWidth,
        innerHeight: window.innerHeight,
        devicePixelRatio: window.devicePixelRatio,
        value: field.value,
        caret: field.selectionStart,
        active: document.activeElement ? document.activeElement.id : null,
        visibility: document.visibilityState,
        link: rect('next'),
        field: rect('field')
      });
    };
  </script>
</body>
</html>
