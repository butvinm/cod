[package]
name = "web_view"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/web_view.rs"
doctest = false

[dependencies]
anyhow.workspace = true
db.workspace = true
# The "web: open url" prompt is a one-line editor.
editor.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
menu.workspace = true
project.workspace = true
serde_json.workspace = true
ui.workspace = true
url.workspace = true
util.workspace = true
workspace.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
# The spike driver checks which modal opened.
command_palette.workspace = true
file_finder.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSBitmapImageRep",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSPasteboardItem",
    "objc2-core-graphics",
] }
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventTypes"] }
objc2-foundation.workspace = true
objc2-web-kit.workspace = true
wry.workspace = true

# WebKitGTK in an X11 child window. The versions match what wry 0.57 uses.
[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"
image.workspace = true
paths.workspace = true
smallvec.workspace = true
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
wry = { workspace = true, features = ["os-webview"] }
x11-dl = "2.21"
