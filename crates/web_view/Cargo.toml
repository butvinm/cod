[package]
name = "web_view"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/web_view.rs"
doctest = false

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
serde_json.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
# The spike driver checks the editor buffer and which modal opened.
command_palette.workspace = true
editor.workspace = true
file_finder.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSBitmapImageRep",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSPasteboardItem",
    "objc2-core-graphics",
] }
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventTypes"] }
objc2-foundation.workspace = true
objc2-web-kit.workspace = true
wry.workspace = true
