[package]
name = "cod_browser"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Helper process that renders web pages off-screen with CEF and sends the frames to Cod (issue #16)."

[lints]
workspace = true

[[bin]]
name = "cod-browser"
path = "src/cod_browser.rs"
doctest = false

# The binary does nothing on other platforms, so the CEF and libc crates are only fetched and
# built on Linux and macOS (issue #23 round 1 adds macOS; cef-rs supports both as aarch64 and
# x86_64 targets, see https://github.com/tauri-apps/cef-rs). `engine.rs`'s `libc::dup2` call is
# POSIX, not Linux-specific, so `libc` is needed on both.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cef.workspace = true
libc.workspace = true
