[package]
name = "codctl"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "The command line that controls the running Cod (story #37): workspace commands over Cod's private Unix socket, one JSON line per request and reply."

[lints]
workspace = true

[lib]
path = "src/codctl.rs"
doctest = false

[[bin]]
name = "codctl"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
